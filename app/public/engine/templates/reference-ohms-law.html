<!doctype html>
<!--
  MagicTouch GOLD STANDARD: locked reference implementation (frozen 2026-11-27 by Meeran Maqsusi).
  Class 10 Ohm's law, exactly as approved. Every future template and simulation must match this page
  in visual polish, typography and motion (CLAUDE.md, "Frozen Reference Standard").

  Open it at /engine/templates/reference-ohms-law.html (the offline server must be running).
  It loads only the shared Gold Standard layer and the simulation template:
    /shared/studio/tokens.css      palette, fonts, spring curve
    /shared/studio-base.css        split screen, elevated cards, IR-pen sliders, Real | Diagram, read-outs, graph
    /shared/motion-engine.js       loop, springs, Web Audio feedback, confetti burst, graph helper, controls
    templates/simulate.js + js/sim-live.js   the live Canvas circuit
  The activity data below is a frozen copy, so later content edits to the Ohm's law activity cannot
  change the reference. Do not edit this file to change the standard: agree the change with Meeran first.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gold Standard reference · Ohm's law · MagicTouch</title>
    <link rel="stylesheet" href="/vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="/shared/studio/tokens.css" />
    <link rel="stylesheet" href="/shared/studio-base.css" />
    <link rel="stylesheet" href="../css/magictouch.css" />
  </head>
  <body>
    <header id="mt-header">
      <div class="brand">
        <b>MagicTouch</b> <span id="mt-crumb">— Gold Standard reference · Class 10 · Ohm's law</span>
      </div>
      <div class="right"><span id="mt-score"></span></div>
    </header>
    <main id="mt-stage">
      <div id="mt-instr"></div>
      <div id="mt-area"></div>
    </main>
    <div id="mt-toast"></div>
    <script type="application/json" id="reference-activity">
      {
        "id": "c10-science-ohms-law",
        "level": "class-10",
        "subject": "science",
        "title": "Ohm's law",
        "icon": "💡",
        "topic": "Voltage, resistance and current",
        "concept": "science.physics.ohms-law",
        "status": "draft",
        "template": "simulate",
        "model": "circuit",
        "instruction": "Change the voltage and resistance. Watch the current and the bulb.",
        "intro": "Current equals voltage divided by resistance. Try the challenges.",
        "sliders": [
          {
            "id": "V",
            "label": "Voltage (V)",
            "min": 1,
            "max": 12,
            "step": 1,
            "value": 3,
            "unit": "V"
          },
          {
            "id": "R",
            "label": "Resistance (R)",
            "min": 1,
            "max": 12,
            "step": 1,
            "value": 6,
            "unit": "Ω"
          }
        ],
        "goals": [
          {
            "text": "Make the current exactly 2 A.",
            "outputs": [
              {
                "id": "I",
                "equals": 2,
                "tol": 0.001
              }
            ],
            "say": "Two amperes. For example, 12 volts across 6 ohms."
          },
          {
            "text": "Make the bulb as bright as possible: 12 A.",
            "outputs": [
              {
                "id": "I",
                "equals": 12,
                "tol": 0.001
              }
            ],
            "say": "Maximum voltage and minimum resistance give the most current."
          },
          {
            "text": "With 10 V, set the resistance so the current is 1 A.",
            "inputs": [
              {
                "id": "V",
                "equals": 10
              }
            ],
            "outputs": [
              {
                "id": "I",
                "equals": 1,
                "tol": 0.001
              }
            ],
            "say": "10 volts divided by 10 ohms is 1 ampere."
          }
        ],
        "doneText": "You've got Ohm's law!"
      }
    </script>
    <script type="module">
      import mount from "./simulate.js";
      const activity = JSON.parse(document.getElementById("reference-activity").textContent);
      const area = document.getElementById("mt-area");
      document.getElementById("mt-instr").textContent = activity.instruction;
      let stop = null;
      function run() {
        if (stop) stop();
        area.innerHTML = "";
        stop = mount(area, activity, { base: "/activities/" + activity.id + "/", again: run, home: run });
      }
      run();
    </script>
  </body>
</html>
